<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bottom to Top Fill Animation</title>
  <style>
    body {
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .animated-heading {
      font-size: 6rem;
      font-weight: bold;
      color: transparent;
      -webkit-text-stroke: 2px #000; /* Outline */
      background: linear-gradient(to top, #000 0%, #000 100%);
      background-clip: text;
      -webkit-background-clip: text;
      background-size: 100% 0%;
      background-repeat: no-repeat;
      animation: fillUp 3s ease-in-out forwards;
    }

    @keyframes fillUp {
      to {
        background-size: 100% 100%;
      }
    }
  </style>
</head>
<body>
  <h1 class="animated-heading">Hello World</h1>
</body>
</html>
